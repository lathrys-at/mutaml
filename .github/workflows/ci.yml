name: Main CI workflow

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        # The three newest minor releases of OCaml. Add the next one
        # when it releases, and drop the oldest.
        ocaml-compiler:
          - 5.3.x
          - 5.4.x
          - 5.5.x

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # The cram tests run under bash and use GNU sed and GNU diff. The
      # runner needs a timeout command that follows the GNU coreutils
      # rules, because it reads its exit status to tell a crash from a
      # timeout. macOS ships none of these.
      - name: Install GNU bash, sed, diff, and coreutils
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew install bash gnu-sed diffutils coreutils
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install the dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build @all

      # The cram tests record the text that the compiler prints, and
      # that text changes between compiler releases: OCaml 5.4 indents
      # the explanation of a non-exhaustive match and 5.3 does not. The
      # recordings follow the newest compiler, so only that column
      # checks them; the older columns prove that the code builds.
      - name: Test
        if: ${{ matrix.ocaml-compiler == '5.5.x' }}
        run: opam exec -- dune build @runtest
